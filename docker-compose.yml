version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: bot_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: multivendor_db
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
